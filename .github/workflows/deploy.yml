name: Deploy Thesis to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/thesis-local-qa-only
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 17687:7687
        options: >-
          --memory 1500m --cpus 2
          --health-cmd "/var/lib/neo4j/bin/cypher-shell -u neo4j -p thesis-local-qa-only 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_NEO4J_URI: bolt://127.0.0.1:17687
          TEST_NEO4J_PASSWORD: thesis-local-qa-only
      - name: Discover official company reports
        run: npm run discover:reports
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
